<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TV Girl</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../Style.css">
</head>
<body>
  <div class="page-shell">
    <div id="menu">
      <a id="logo" href="index.html"><h2>Tunely</h2></a>
      <div class="search-wrapper">
        <input type="text" id="search" placeholder="Search songs..." aria-label="Search songs">
        <div id="suggestions" class="suggestions"></div>
      </div>
    </div>

    <main id="conteudo">
      <header id="album-header">
        <img src="Images/tv girl.jpg" alt="TV Girl">
        <div>
          <h1>TV Girl</h1>
          <p>Artist • Playlist</p>
        </div>
      </header>

      <section aria-label="TV Girl songs">
        <div class="song" onclick="playSong(0)"><img src="Audios/TV Girl/better in the dark.jpg" class="song-icon" alt="">Better in the Dark</div>
        <div class="song" onclick="playSong(1)"><img src="Audios/TV Girl/Blue Hair.jpg" class="song-icon" alt="">Blue Hair</div>
        <div class="song" onclick="playSong(2)"><img src="Audios/TV Girl/2.jpg" class="song-icon" alt="">Cigarettes out the Window</div>
        <div class="song" onclick="playSong(3)"><img src="Audios/TV Girl/it almost worked.jpg" class="song-icon" alt="">It Almost Worked</div>
        <div class="song" onclick="playSong(4)"><img src="Audios/TV Girl/2.jpg" class="song-icon" alt="">Louise</div>
        <div class="song" onclick="playSong(5)"><img src="Audios/TV Girl/2.jpg" class="song-icon" alt="">Lovers Rock</div>
        <div class="song" onclick="playSong(6)"><img src="Audios/TV Girl/1.jpg" class="song-icon" alt="">Loving Machine</div>
        <div class="song" onclick="playSong(7)"><img src="Audios/TV Girl/1.jpg" class="song-icon" alt="">Not Allowed</div>
        <div class="song" onclick="playSong(8)"><img src="Audios/TV Girl/1.jpg" class="song-icon" alt="">Taking What's Not Yours</div>
        <div class="song" onclick="playSong(9)"><img src="Audios/TV Girl/2.jpg" class="song-icon" alt="">The Blonded</div>
      </section>
    </main>

    <section id="player" aria-label="Music player"></section>
    <audio id="audio"></audio>
    <div class="page-transition"></div>
  </div>

  <script src="songCatalog.js"></script>
  <script src="script.js"></script>
  <script>
    const audio = document.getElementById('audio');
    const nowPlaying = document.getElementById('nowPlaying');
    const progress = document.getElementById('progress');
    const volume = document.getElementById('volume');
    const muteButton = document.getElementById('muteBtn');
    const playButton = document.getElementById('playBtn');
    const loopButton = document.getElementById('loopBtn');
    const songs = Array.from(document.querySelectorAll('.song'));
    const playlist = [
      'Audios/TV Girl/Better in the Dark.mp3',
      'Audios/TV Girl/Blue Hair.mp3',
      'Audios/TV Girl/Cigarettes out the Window.mp3',
      'Audios/TV Girl/It Almost Worked.mp3',
      'Audios/TV Girl/Louise Lyrics.mp3',
      'Audios/TV Girl/Lovers Rock.mp3',
      'Audios/TV Girl/Loving Machine.mp3',
      'Audios/TV Girl/Not Allowed.mp3',
      "Audios/TV Girl/Taking What's Not Yours.mp3",
      'Audios/TV Girl/The Blonded.mp3'
    ];
    const names = [
      'Better in the Dark',
      'Blue Hair',
      'Cigarettes out the Window',
      'It Almost Worked',
      'Louise Lyrics',
      'Lovers Rock',
      'Loving Machine',
      'Not Allowed',
      "Taking What's Not Yours",
      'The Blonded'
    ];
    let currentSong = -1;

    function playSong(index) {
      currentSong = index;
      audio.src = playlist[index];
      nowPlaying.textContent = names[index];
      progress.value = 0;
      progress.disabled = false;
      playButton.disabled = false;
      songs.forEach((song, songIndex) => song.classList.toggle('active', songIndex === index));
      audio.play().catch((error) => {
        console.error('Could not play the selected TV Girl track.', error);
      });
    }

    function togglePlay() {
      if (currentSong < 0) {
        playSong(0);
      } else if (audio.paused) {
        audio.play().catch((error) => console.error('Could not resume the TV Girl track.', error));
      } else {
        audio.pause();
      }
    }

    function nextSong() {
      playSong((currentSong + 1) % playlist.length);
    }

    function prevSong() {
      playSong((currentSong - 1 + playlist.length) % playlist.length);
    }

    function toggleLoop() {
      audio.loop = !audio.loop;
      loopButton.classList.toggle('active', audio.loop);
    }

    function toggleMute() {
      audio.muted = !audio.muted;
      muteButton.textContent = audio.muted ? '🔇' : '🔊';
    }

    function formatTime(seconds) {
      return `${Math.floor(seconds / 60)}:${String(Math.floor(seconds % 60)).padStart(2, '0')}`;
    }

    audio.addEventListener('timeupdate', () => {
      if (!Number.isFinite(audio.duration) || audio.duration <= 0) return;
      progress.value = (audio.currentTime / audio.duration) * 100;
      document.getElementById('time').textContent =
        `${formatTime(audio.currentTime)} / ${formatTime(audio.duration)}`;
    });

    progress.addEventListener('input', () => {
      if (Number.isFinite(audio.duration)) {
        audio.currentTime = (Number(progress.value) / 100) * audio.duration;
      }
    });

    volume.addEventListener('input', () => {
      audio.volume = Number(volume.value);
    });

    audio.addEventListener('volumechange', () => {
      muteButton.textContent = audio.muted ? '🔇' : '🔊';
    });

    audio.addEventListener('error', () => {
      if (currentSong >= 0) {
        console.error(`The TV Girl track could not be loaded: ${playlist[currentSong]}`);
      }
    });
  </script>
</body>
</html>
