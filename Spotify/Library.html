<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Playlist Library</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../Style.css?v=3">
</head>
<body>
  <div id="app" class="page-shell">
    <aside id="menu" class="sidebar">
      <a id="logo" href="index.html" class="brand">Tunely</a>
      <nav class="nav-links" aria-label="Primary navigation" data-i18n-aria-label="primaryNavigation">
        <a class="nav-btn" href="index.html" data-i18n="discover">Home</a>
        <a class="nav-btn active" href="Library.html" data-i18n="library">Library</a>
        <a class="nav-btn" href="Favorites.html" data-i18n="favorites">Favorites</a>
      </nav>
    </aside>

    <main class="main-content">
      <header class="topbar sticky">
        <h1 data-i18n="playlistLibrary">Playlist Library</h1>
      </header>

      <section class="section">
        <div class="section-header">
          <div>
            <h2 data-i18n="playlistsHeading">Your playlists</h2>
          </div>
        </div>
        <div id="playlistCollection" aria-live="polite"></div>
        <div id="playlistsEmpty" class="empty-state" data-i18n="playlistsEmpty" hidden>
          No playlists yet. Use a song menu to create one and add songs.
        </div>
      </section>
    </main>

    <section id="player" aria-label="Music player">
      <span><span data-i18n="nowPlaying">Now Playing:</span> <span id="nowPlaying" data-i18n="none">None</span></span>
      <input type="range" id="progress" min="0" max="100" value="0" aria-label="Track progress" data-i18n-aria-label="trackProgress" disabled>
      <span id="time">0:00 / 0:00</span>

      <div class="button-group">
        <button class="control-btn" type="button" aria-label="Previous song" data-i18n-aria-label="previousSong" data-playlist-previous disabled>
          <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6L18 6v12z"/></svg>
        </button>
        <button id="playBtn" type="button" aria-label="Play or pause" data-i18n-aria-label="playPause" disabled>
          <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <button class="control-btn" type="button" aria-label="Next song" data-i18n-aria-label="nextSong" data-playlist-next disabled>
          <svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 6l8.5 6L6 18z"/></svg>
        </button>
        <button id="loopBtn" class="control-btn" type="button" aria-label="Toggle repeat" data-i18n-aria-label="toggleRepeat">
          <svg viewBox="0 0 24 24"><path d="M17 1l4 4-4 4V6H7v4H5V6a2 2 0 0 1 2-2h10V1zM7 23l-4-4 4-4v3h10v-4h2v4a2 2 0 0 1-2 2H7v3z"/></svg>
        </button>
      </div>

      <div class="controls">
        <button id="muteBtn" type="button" aria-label="Mute or unmute" data-i18n-aria-label="muteUnmute">🔊</button>
        <input type="range" id="volume" min="0" max="1" step="0.01" value="1" aria-label="Volume" data-i18n-aria-label="volume">
        <button id="likeBtn" class="like-btn" type="button" aria-label="Like song" aria-pressed="false" title="Like song">♡</button>
      </div>
    </section>
    <audio id="audio"></audio>
  </div>

  <script src="songCatalog.js" defer></script>
  <script src="script.js" defer></script>
</body>
</html>
